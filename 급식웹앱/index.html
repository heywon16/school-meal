<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대양초등학교 스마트 식단표</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            fadeIn: 'fadeIn 0.3s ease-in-out',
            slideUp: 'slideUp 0.4s ease-out',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 폰트 및 모바일 스크롤 최적화 */
    body { 
      font-family: 'Nunito', 'Jua', 'Noto Sans KR', sans-serif; 
      background-color: #E2E8F0; /* PC에서 볼 때 바탕은 회색 */
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const ALLERGENS = {
      1: { name: '난류', emoji: '🥚' },
      2: { name: '우유', emoji: '🥛' },
      3: { name: '메밀', emoji: '🌾' },
      4: { name: '땅콩', emoji: '🥜' },
      5: { name: '대두', emoji: '🫘' },
      6: { name: '밀', emoji: '🍞' },
      7: { name: '고등어', emoji: '🐟' },
      8: { name: '게', emoji: '🦀' },
      9: { name: '새우', emoji: '🦐' },
      10: { name: '돼지고기', emoji: '🐷' },
      11: { name: '복숭아', emoji: '🍑' },
      12: { name: '토마토', emoji: '🍅' },
      13: { name: '아황산류', emoji: '🧪' },
      14: { name: '호두', emoji: '🪵' },
      15: { name: '닭고기', emoji: '🐔' },
      16: { name: '쇠고기', emoji: '🐮' },
      17: { name: '오징어', emoji: '🦑' },
      18: { name: '조개류', emoji: '🦪' },
      19: { name: '잣', emoji: '🌲' }
    };

    function App() {
      // 오늘 날짜로 시작하도록 초기화 (데모를 제거했으므로 실제 현재 날짜 사용)
      const [selectedDate, setSelectedDate] = useState(new Date());
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [mealData, setMealData] = useState(null);
      const [weeklyMeals, setWeeklyMeals] = useState({});
      const [viewMode, setViewMode] = useState('daily');
      const [selectedAllergens, setSelectedAllergens] = useState([]);
      const [notification, setNotification] = useState(null);
      const [showAllergenFilter, setShowAllergenFilter] = useState(false);

      // 모바일 환경에 맞게 학교 정보 설정
      const schoolConfig = {
        officeCode: 'J10',
        schoolCode: '7679380',
        schoolName: '대양초등학교',
      };

      const formatDateString = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
      };

      const getDayOfWeekKorean = (date) => {
        const days = ['일', '월', '화', '수', '목', '금', '토'];
        return days[date.getDay()];
      };

      const triggerNotification = (message, type = 'info') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3000);
      };

      const fetchMeals = async (targetDate) => {
        setLoading(true);
        setError(null);
        const dateStr = formatDateString(targetDate);

        try {
          // Vercel Serverless Function 호출 (API 키 숨김 처리)
          const url = `/api/meals?date=${dateStr}`;
          
          const response = await fetch(url);
          if (!response.ok) throw new Error('서버 통신 실패');
          
          const json = await response.json();

          if (json.mealServiceDietInfo) {
            const data = json.mealServiceDietInfo[1].row[0];
            setMealData({
              DDISH_NM: data.DDISH_NM,
              CAL_INFO: data.CAL_INFO,
              MMLAL_INFO: data.MMLAL_INFO || '중식'
            });
          } else {
            setMealData(null);
            if (json.RESULT && json.RESULT.CODE === 'INFO-200') {
              setError('등록된 급식이 없습니다. (주말, 방학 등)');
            } else {
              setError(json.RESULT?.MESSAGE || '정보를 가져올 수 없습니다.');
            }
          }
        } catch (err) {
          console.error(err);
          setError('서버 연결 중 오류가 발생했습니다.');
        } finally {
          setLoading(false);
        }
      };

      const fetchWeeklyMeals = async (currentDate) => {
        setLoading(true);
        const weekStart = new Date(currentDate);
        const day = weekStart.getDay();
        const diff = weekStart.getDate() - day + (day === 0 ? -6 : 1);
        weekStart.setDate(diff);

        const fromDateStr = formatDateString(weekStart);
        
        const weekEnd = new Date(weekStart);
        weekEnd.setDate(weekStart.getDate() + 4);
        const toDateStr = formatDateString(weekEnd);

        try {
          // Vercel Serverless Function 호출
          const url = `/api/meals?startDate=${fromDateStr}&endDate=${toDateStr}`;
          
          const response = await fetch(url);
          const json = await response.json();
          
          if (json.mealServiceDietInfo) {
            const rows = json.mealServiceDietInfo[1].row;
            const resultObj = {};
            rows.forEach(item => {
              resultObj[item.MLSV_YMD] = {
                DDISH_NM: item.DDISH_NM,
                CAL_INFO: item.CAL_INFO,
              };
            });
            setWeeklyMeals(resultObj);
          } else {
            setWeeklyMeals({});
          }
        } catch (err) {
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchMeals(selectedDate);
        if (viewMode === 'weekly') fetchWeeklyMeals(selectedDate);
      }, [selectedDate]);

      useEffect(() => {
        if (viewMode === 'weekly') fetchWeeklyMeals(selectedDate);
      }, [viewMode]);

      const changeDate = (amount) => {
        const next = new Date(selectedDate);
        next.setDate(selectedDate.getDate() + amount);
        setSelectedDate(next);
      };

      const toggleAllergen = (num) => {
        if (selectedAllergens.includes(num)) {
          setSelectedAllergens(prev => prev.filter(x => x !== num));
        } else {
          setSelectedAllergens(prev => [...prev, num]);
          triggerNotification(`${ALLERGENS[num].emoji} 주의 필터 활성화!`, 'warning');
        }
      };

      const parseMenu = (rawString) => {
        if (!rawString) return [];
        return rawString.split(/<br\s*\/?>/gi).map(item => {
          item = item.trim();
          if(!item) return null;
          const match = item.match(/\(([^)]+)\)/);
          const name = item.replace(/\([^)]+\)/g, '').trim();
          let codes = match && match[1] ? match[1].split('.').map(Number).filter(n => !isNaN(n)) : [];
          return { name, allergens: codes };
        }).filter(Boolean);
      };

      const checkAllergenMatch = (codes) => codes.some(c => selectedAllergens.includes(c));

      const activeAllergyCount = useMemo(() => {
        if (!mealData) return 0;
        return parseMenu(mealData.DDISH_NM).filter(item => checkAllergenMatch(item.allergens)).length;
      }, [mealData, selectedAllergens]);

      // 오늘 버튼 핸들러
      const goToday = () => {
        setSelectedDate(new Date());
        triggerNotification('오늘 날짜로 이동했습니다.', 'success');
      };

      return (
        <div className="w-full flex justify-center selection:bg-blue-200">
          <div className="w-full max-w-md bg-[#F8F7F4] min-h-screen shadow-2xl relative flex flex-col overflow-x-hidden">
            
            {/* 토스트 알림 */}
            {notification && (
              <div className="absolute top-16 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm">
                <div className={`flex items-center gap-2 px-4 py-3 rounded-2xl shadow-xl border animate-fadeIn ${
                  notification.type === 'warning' ? 'bg-amber-500 text-white border-amber-400' :
                  notification.type === 'success' ? 'bg-blue-500 text-white border-blue-400' :
                  'bg-slate-800 text-white border-slate-700'
                }`}>
                  {notification.type === 'warning' ? <i className="fa-solid fa-triangle-exclamation"></i> : <i className="fa-solid fa-bell"></i>}
                  <span className="font-bold text-sm">{notification.message}</span>
                </div>
              </div>
            )}

            {/* 메인 헤더 - 텍스트 배경 제거 및 폰트 확대, 중앙 정렬 */}
            <header className="bg-white/90 backdrop-blur-md sticky top-0 z-40 px-5 py-3 flex items-center shadow-sm relative overflow-hidden">
              <div className="w-20 h-20 shrink-0 transition-transform hover:scale-105 relative z-10">
                <img src="./급식로고.png" alt="대양초 로고" className="w-full h-full object-contain drop-shadow-sm scale-[1.35]" />
              </div>
              <div className="flex-1 flex justify-center relative z-10 -ml-2">
                <h1 className="text-[25px] font-black text-slate-800 tracking-tight whitespace-nowrap drop-shadow-sm">대양초 스마트 급식 앱</h1>
              </div>
            </header>

            <main className="flex-1 pb-8 flex flex-col">
              
              {/* 날짜 컨트롤러 */}
              <div className="bg-white px-4 py-4 rounded-b-3xl shadow-sm z-30 relative border-t border-slate-50">
                <div className="flex items-center justify-between bg-slate-50 p-2.5 rounded-2xl border border-slate-100 shadow-inner">
                  <button onClick={() => changeDate(-1)} className="w-12 h-12 flex items-center justify-center text-slate-500 hover:bg-white rounded-xl active:scale-95 transition-all text-xl">
                    <i className="fa-solid fa-chevron-left"></i>
                  </button>
                  
                  <div className="flex flex-col items-center cursor-pointer" onClick={goToday} title="오늘로 이동">
                    <span className="text-[11px] font-extrabold text-slate-400 mb-0.5 tracking-wider">{selectedDate.getFullYear()}년 {selectedDate.getMonth() + 1}월</span>
                    <div className="flex items-center gap-1.5">
                      <span className="text-2xl font-black text-slate-800">{selectedDate.getDate()}일</span>
                      <span className={`text-sm font-bold px-2 py-0.5 rounded-lg shadow-sm ${
                        selectedDate.getDay() === 0 ? 'bg-rose-100 text-rose-600 border border-rose-200' : 
                        selectedDate.getDay() === 6 ? 'bg-blue-100 text-blue-600 border border-blue-200' : 'bg-slate-200 text-slate-700 border border-slate-300'
                      }`}>
                        {getDayOfWeekKorean(selectedDate)}
                      </span>
                    </div>
                  </div>

                  <button onClick={() => changeDate(1)} className="w-12 h-12 flex items-center justify-center text-slate-500 hover:bg-white rounded-xl active:scale-95 transition-all text-xl">
                    <i className="fa-solid fa-chevron-right"></i>
                  </button>
                </div>
              </div>

              {/* 콘텐츠 영역 */}
              <div className="p-4 space-y-4 animate-slideUp mt-2">
                
                {/* 뷰 모드 및 알레르기 탭 */}
                <div className="flex bg-slate-200/50 p-1.5 rounded-xl shadow-inner border border-slate-200/50">
                  <button onClick={() => setViewMode('daily')} className={`flex-1 py-2.5 text-xs font-black rounded-lg transition-all ${viewMode === 'daily' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500 hover:bg-slate-200'}`}>오늘 식단</button>
                  <button onClick={() => setViewMode('weekly')} className={`flex-1 py-2.5 text-xs font-black rounded-lg transition-all ${viewMode === 'weekly' ? 'bg-white shadow-md text-blue-600' : 'text-slate-500 hover:bg-slate-200'}`}>주간 식단</button>
                  <button onClick={() => setShowAllergenFilter(!showAllergenFilter)} className={`flex-1 py-2.5 text-xs font-black rounded-lg transition-all ${showAllergenFilter ? 'bg-rose-50 text-rose-600 shadow-md border border-rose-100' : 'text-slate-500 hover:bg-slate-200'}`}><i className="fa-solid fa-filter"></i> 알레르기</button>
                </div>

                {/* 알레르기 필터 (토글됨) */}
                {showAllergenFilter && (
                  <div className="bg-white p-5 rounded-3xl shadow-sm border border-rose-100 animate-fadeIn">
                    <h3 className="text-sm font-extrabold text-rose-600 mb-3 flex items-center gap-2">
                      <i className="fa-solid fa-triangle-exclamation"></i> 내 알레르기 선택
                    </h3>
                    <p className="text-[10px] text-slate-400 mb-3 font-semibold leading-relaxed">
                      주의해야 할 성분을 탭해서 활성화하세요. 해당 성분이 포함된 메뉴가 빨간색으로 경고 표시됩니다.
                    </p>
                    <div className="flex flex-wrap gap-2 pt-1 pb-1">
                      {Object.entries(ALLERGENS).map(([code, info]) => {
                        const numCode = parseInt(code, 10);
                        const isSelected = selectedAllergens.includes(numCode);
                        return (
                          <button
                            key={code}
                            onClick={() => toggleAllergen(numCode)}
                            className={`px-3 py-2 rounded-xl text-xs font-bold transition-all border ${
                              isSelected ? 'bg-rose-500 text-white border-rose-600 shadow-md scale-105' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'
                            }`}
                          >
                            {info.emoji} {info.name}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {loading ? (
                  <div className="py-24 flex flex-col items-center justify-center">
                    <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-sm font-extrabold text-slate-400 animate-pulse">식단 정보를 가져오고 있어요...</p>
                  </div>
                ) : viewMode === 'daily' ? (
                  
                  /* 일간 모드 */
                  <div className="space-y-4">
                    {error && !mealData ? (
                      <div className="bg-white p-10 rounded-3xl text-center shadow-sm border border-slate-100 mt-2">
                        <i className="fa-solid fa-face-frown-open text-5xl text-slate-300 mb-5"></i>
                        <h4 className="text-lg font-extrabold text-slate-700 mb-2">등록된 식단이 없어요!</h4>
                        <p className="text-xs font-semibold text-slate-500 leading-relaxed break-keep">{error}</p>
                      </div>
                    ) : mealData && (
                      <>
                        {/* 메인 식단 카드 */}
                        <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 relative overflow-hidden mt-2">
                          <div className="absolute -top-4 -right-4 text-9xl text-blue-50 opacity-40 pointer-events-none rotate-12">
                            <i className="fa-solid fa-utensils"></i>
                          </div>
                          
                          <div className="flex justify-between items-center mb-6 relative z-10">
                            <span className="text-xs font-extrabold bg-blue-100 text-blue-800 px-3 py-1.5 rounded-xl shadow-sm border border-blue-200">
                              <i className="fa-solid fa-bowl-food mr-1"></i> {mealData.MMLAL_INFO}
                            </span>
                            <span className="text-xs font-extrabold text-amber-600 bg-amber-50 px-3 py-1.5 rounded-xl border border-amber-100 shadow-sm">
                              <i className="fa-solid fa-fire mr-0.5"></i> {mealData.CAL_INFO}
                            </span>
                          </div>

                          {activeAllergyCount > 0 && (
                            <div className="bg-rose-50 border border-rose-200 p-4 rounded-2xl mb-5 flex gap-3 relative z-10 shadow-sm">
                              <i className="fa-solid fa-triangle-exclamation text-rose-500 mt-0.5 text-lg"></i>
                              <p className="text-xs font-bold text-rose-700 leading-relaxed">
                                선택하신 알레르기 유발 물질이 <br/>오늘 메뉴 중 <span className="text-rose-900 font-black text-sm underline">{activeAllergyCount}개</span>에 포함되어 있어요!
                              </p>
                            </div>
                          )}

                          <div className="space-y-3 relative z-10">
                            {parseMenu(mealData.DDISH_NM).map((food, idx) => {
                              const hasWarning = checkAllergenMatch(food.allergens);
                              return (
                                <div key={idx} className={`p-4 rounded-2xl flex flex-col gap-2.5 transition-all ${hasWarning ? 'bg-rose-50 border border-rose-200 shadow-sm' : 'bg-slate-50 border border-slate-100'}`}>
                                  <div className="flex justify-between items-center">
                                    <span className={`font-extrabold text-base tracking-tight ${hasWarning ? 'text-rose-900' : 'text-slate-800'}`}>
                                      {food.name}
                                    </span>
                                    {hasWarning && <i className="fa-solid fa-triangle-exclamation text-rose-500 text-sm animate-pulse"></i>}
                                  </div>
                                  
                                  {food.allergens.length > 0 && (
                                    <div className="flex flex-wrap gap-1.5 mt-1">
                                      {food.allergens.map(code => {
                                        const isT = selectedAllergens.includes(code);
                                        return ALLERGENS[code] ? (
                                          <span key={code} className={`text-[10px] font-extrabold px-2 py-1 rounded-lg border ${isT ? 'bg-rose-500 text-white border-rose-600 shadow-sm' : 'bg-white text-slate-500 border-slate-200'}`}>
                                            {ALLERGENS[code].emoji} {ALLERGENS[code].name}
                                          </span>
                                        ) : null;
                                      })}
                                    </div>
                                  )}
                                </div>
                              )
                            })}
                          </div>
                        </div>
                      </>
                    )}
                  </div>

                ) : (

                  /* 주간 모드 (세로 리스트) */
                  <div className="space-y-3 mt-2">
                    {Array.from({length: 5}).map((_, i) => {
                      const d = new Date(selectedDate);
                      const day = d.getDay();
                      d.setDate(d.getDate() - day + (day === 0 ? -6 : 1) + i);
                      const str = formatDateString(d);
                      const dayMeal = weeklyMeals[str];
                      const isToday = d.getDate() === selectedDate.getDate();

                      return (
                        <div 
                          key={i} 
                          onClick={() => { setSelectedDate(d); setViewMode('daily'); }}
                          className={`bg-white rounded-3xl p-5 shadow-sm border transition-all active:scale-95 cursor-pointer ${isToday ? 'border-blue-400 ring-4 ring-blue-50 shadow-md' : 'border-slate-100'}`}
                        >
                          <div className="flex justify-between items-center mb-3 border-b border-slate-100 pb-3">
                            <div className="flex items-center gap-2.5">
                              <span className={`text-sm font-black px-2.5 py-1 rounded-xl shadow-sm ${i===4 ? 'bg-blue-100 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-700 border border-slate-200'}`}>
                                {getDayOfWeekKorean(d)}요일
                              </span>
                              <span className="text-xs font-bold text-slate-400">{d.getMonth()+1}월 {d.getDate()}일</span>
                            </div>
                            {dayMeal && <span className="text-[10px] font-extrabold text-amber-600 bg-amber-50 px-2 py-1 rounded-lg border border-amber-100">{dayMeal.CAL_INFO}</span>}
                          </div>
                          
                          {dayMeal ? (
                            <p className="text-xs font-bold text-slate-700 leading-loose">
                              {parseMenu(dayMeal.DDISH_NM).map(m => m.name).join(', ')}
                            </p>
                          ) : (
                            <div className="py-4 text-center">
                              <p className="text-xs font-bold text-slate-400 bg-slate-50 py-2 rounded-xl inline-block px-4">식단 정보가 없어요</p>
                            </div>
                          )}
                        </div>
                      )
                    })}
                  </div>

                )}
              </div>
            </main>


          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
